<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Owner Panel | Anand Adda</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><main><a href="index.html">← Public website</a><section id="login"><p>ANAND ADDA · OWNER ACCESS</p><h1>Welcome back.</h1><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button><b id="loginMsg"></b></form></section><section id="panel" hidden><header><div><p>STORE MANAGEMENT</p><h1>Make it yours.</h1></div><button id="signOut">Sign out</button></header><nav><button class="tab active" data-target="products">Products</button><button class="tab" data-target="details">Shop details</button><button class="tab" data-target="offers">Offers</button></nav><article id="products"><h2>Weekly products</h2><form id="productForm"><label>Product name<input name="name" required></label><label>Price ₹<input name="price" type="number"></label><label>Category<input name="category"></label><label>Sizes (S, M, L)<input name="sizes"></label><label class="wide">Description<textarea name="description"></textarea></label><label class="wide">Product photos<input id="photos" type="file" accept="image/*" multiple></label><button>Add product</button><b id="productMsg"></b></form><div id="productList"></div></article><article id="details" hidden><h2>Shop details</h2><form id="settingsForm"><label>Shop name<input name="shop_name"></label><label>Opening hours<input name="opening_hours"></label><label class="wide">Hero text<textarea name="hero_text"></textarea></label><label class="wide">About<textarea name="about_text"></textarea></label><label class="wide">Address<textarea name="address"></textarea></label><label>Phone<input name="phone"></label><label>WhatsApp number<input name="whatsapp"></label><label>Instagram<input name="instagram"></label><label>Maps link<input name="maps_url"></label><button>Save details</button><b id="settingsMsg"></b></form></article><article id="offers" hidden><h2>Offers</h2><form id="offerForm"><label class="wide">Offer title<input name="title" required></label><label class="wide">Details<textarea name="details"></textarea></label><button>Publish offer</button><b id="offerMsg"></b></form><div id="offerList"></div></article></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
