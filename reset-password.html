<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Reset your Anand Adda Owner Panel password">
  <title>Reset password | Anand Adda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main>
    <a class="public-link" href="admin.html">← Back to Owner Panel sign in</a>

    <section id="requestCard" class="login-card">
      <p class="eyebrow">ANAND ADDA · OWNER ACCESS</p>
      <h1>Reset password.</h1>
      <p class="auth-intro">Enter your Owner Panel email and we will send you a secure link to choose a new password.</p>
      <form id="requestForm" class="login-form">
        <label>Email<input id="resetEmail" type="email" autocomplete="email" required></label>
        <button type="submit">Email me a reset link</button>
        <p class="form-message" id="requestMsg" aria-live="polite"></p>
      </form>
    </section>

    <section id="updateCard" class="login-card" hidden>
      <p class="eyebrow">ANAND ADDA · OWNER ACCESS</p>
      <h1>Choose a new password.</h1>
      <p class="auth-intro">Use at least 8 characters and keep it somewhere safe.</p>
      <form id="updateForm" class="login-form">
        <label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <button type="submit">Save new password</button>
        <p class="form-message" id="updateMsg" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
